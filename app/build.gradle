plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nextdeliph.gembound'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nextdeliph.gembound'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
